services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: quantforge
      POSTGRES_USER: quantforge
      POSTGRES_PASSWORD: quantforge
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U quantforge"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  quantforge:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://quantforge:quantforge@db:5432/quantforge
      APP_SECRET: docker-dev-secret
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
